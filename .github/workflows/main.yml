name: CI

on:
  pull_request:
    branches:
      - main
  # Выкладка запускается вручную: Actions → CI → Run workflow (выберите ветку main).
  workflow_dispatch:

jobs:
  tests:
    if: github.event_name == 'pull_request'
    # Раннер GitHub: раньше здесь был self-hosted, и без поднятого раннера задачи просто висели в очереди.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_password
          POSTGRES_DB: django_db
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U django_user -d django_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: 1.8.4
      - name: Install dependencies
        run: poetry install --with dev
      - name: Flake8 and tests
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_password
          POSTGRES_DB: django_db
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 55432
          ACCESS_TOKEN: qwerty123456
        run: |
          poetry run flake8
          poetry run pytest

  deploy:
    # То же, что scripts/deploy.sh на машине разработчика: образ из коммита, затем kubectl на сервере по SSH
    # (`sudo k0s kubectl`), миграции и статика ДО перезапуска приложения. Секреты репозитория:
    #   DEPLOY_SSH          пользователь@сервер
    #   DEPLOY_SSH_KEY      закрытый ключ этого пользователя
    #   DEPLOY_KNOWN_HOSTS  строка known_hosts сервера (ssh-keyscan -t ed25519 сервер)
    #   DOCKER_USERNAME, DOCKER_PASSWORD  учётная запись Docker Hub для публикации образа
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          DEPLOY_SSH: ${{ secrets.DEPLOY_SSH }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          scripts/deploy.sh --ssh "$DEPLOY_SSH" \
            --ssh-opts "-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes" --yes
