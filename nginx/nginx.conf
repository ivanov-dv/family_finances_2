# Кеширование /static/. Файлы из fonts/ и vendor/ (версия зашита в путь) и любые URL с ?v=<хеш>
# (его добавляет family_finances.storage.VersionedStaticFilesStorage) неизменны — кешируем на год.
# Всё остальное браузер перепроверяет по ETag. Тот же блок — в k8s/configmap-nginx.yaml.
map "$uri?$arg_v" $static_cache_control {
  default "no-cache";
  "~^/static/(fonts|vendor)/" "public, max-age=31536000, immutable";
  "~^/static/.+\?.+$" "public, max-age=31536000, immutable";
}

server {
  listen 80;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript image/svg+xml;

  location /static/ {
    alias /static/;
    add_header Cache-Control $static_cache_control;
  }

  location / {
    proxy_set_header Host $http_host;
    proxy_pass http://django:8000/;
  }

}
