<div class="app-modal-backdrop" id="loginModal" hidden>
    <div class="app-modal" role="dialog" aria-modal="true" aria-labelledby="loginModalTitle">
        <button type="button" class="app-modal-close" data-close-app-modal aria-label="Закрыть">
            <svg class="icon"><use href="#i-x"/></svg>
        </button>
        <div class="app-modal-title" id="loginModalTitle">Вход</div>
        <div class="app-modal-subtitle">Введите логин и пароль</div>

        <form id="loginForm" data-url="{% url 'users:ajax_login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="username">Логин</label>
                <input class="form-input" type="text" id="username" name="username" placeholder="Введите логин"
                       autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Пароль</label>
                <input class="form-input" type="password" id="password" name="password" placeholder="Введите пароль"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="submit-btn">
                <svg class="icon"><use href="#i-check"/></svg>
                <span>Войти</span>
            </button>
            <div id="loginError" role="alert" style="color:var(--red);font-size:13px;margin-top:12px;font-weight:500;text-align:center;white-space:pre-line"></div>
        </form>

        <div style="margin-top:18px;padding-top:18px;border-top:1px solid var(--border);display:flex;justify-content:center">
            {% include 'includes/auth_telegram.html' %}
        </div>
    </div>
</div>
