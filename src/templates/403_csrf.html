<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FF — Запрос отклонён</title>
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
               font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: Canvas; color: CanvasText; }
        main { max-width: 440px; text-align: center; }
        h1 { font-size: 24px; margin: 0 0 12px; }
        p { margin: 0 0 24px; line-height: 1.5; opacity: .8; }
        a { display: inline-block; padding: 10px 20px; border-radius: 10px; background: #3d6be6; color: #fff; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <h1>Запрос отклонён</h1>
        <p>Сессия устарела или запрос не прошёл проверку безопасности. Обновите страницу и повторите действие. Если ошибка повторяется, убедитесь, что в браузере включены cookies.</p>
        <a href="/">На главную</a>
    </main>
</body>
</html>
