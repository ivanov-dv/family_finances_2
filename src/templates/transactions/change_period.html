{% extends 'base.html' %}

{% block extra_scripts %}
<script>
const MONTH_NAMES = ['','Январь','Февраль','Март','Апрель','Май','Июнь',
                     'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
document.querySelectorAll('.period-item-text').forEach(el => {
    const [year, month] = el.textContent.trim().split('_');
    el.textContent = MONTH_NAMES[parseInt(month)] + ' ' + year;
});
</script>
{% endblock %}

{% block content %}
    <div class="header">
        <div>
            <div class="header-title">Выберите период</div>
            <div class="header-sub">Доступные периоды по текущему пространству</div>
        </div>
    </div>

    <div class="card" style="max-width:520px;width:100%">
        {% if periods %}
            <div class="period-list">
                {% for period in periods %}
                    <a class="period-item"
                       href="{% url 'transactions:apply_period' %}?period={{ period|urlencode }}&next={{ next|urlencode }}">
                        <svg class="icon icon-sm" style="color:var(--text-muted)"><use href="#i-calendar"/></svg>
                        <span class="period-item-text">{{ period }}</span>
                        <svg class="icon icon-sm" style="color:var(--text-muted);margin-left:auto"><use href="#i-chevron-right"/></svg>
                    </a>
                {% endfor %}
            </div>
        {% else %}
            <div style="text-align:center;padding:24px 8px;color:var(--text-muted);font-size:14px">
                <svg class="icon icon-lg" style="margin-bottom:12px"><use href="#i-calendar"/></svg>
                <div>Периоды не найдены</div>
            </div>
        {% endif %}
    </div>
{% endblock %}
