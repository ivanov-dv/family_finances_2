{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block content %}
<div class="profile-page" style="max-width:520px;margin:0 auto">

    <div class="header-title">Смена пароля</div>

    <div class="card">
        <div class="card-header">
            <div>
                <div class="card-title">Новый пароль</div>
                <div class="card-subtitle">Введите текущий и новый пароль</div>
            </div>
        </div>

        {% if form.non_field_errors %}
            <div class="alert-msg alert-error">
                <svg class="icon icon-sm"><use href="#i-x"/></svg>
                <span>{{ form.non_field_errors|join:" " }}</span>
            </div>
        {% endif %}

        <form method="post" novalidate>
            {% csrf_token %}
            {% bootstrap_form form %}
            <div class="profile-form-actions">
                <button type="submit" class="btn btn-primary">Изменить пароль</button>
                <a href="{% url 'users:profile' %}" class="btn btn-ghost">Назад</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
