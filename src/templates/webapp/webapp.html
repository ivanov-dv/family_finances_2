<!DOCTYPE html>
<html lang='ru'>
<head>
    <meta charset='UTF-8'>
    <title>Web App</title>
</head>
<body>

<script src='https://telegram.org/js/telegram-web-app.js'></script>
<script>
    Telegram.WebApp.ready();
    // Помечаем вкладку: страницы сайта учитывают, что открыты внутри Telegram (например, подсказка у кнопки «Excel»).
    try { sessionStorage.setItem('ff-telegram-webapp', '1'); } catch (e) { }

    const initData = Telegram.WebApp.initData;

    console.log(initData)
    // Отправляем данные на сервер Django
    fetch('{% url 'users:webapp_auth' %}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ initData }),
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            console.log('Авторизация успешна!');
            // Перенаправляем на главную страницу
            window.location.href = '{% url 'transactions:summary' %}';
        } else {
            console.error('Ошибка авторизации:', data.error);
        }
    });
</script>


</body>
</html>
